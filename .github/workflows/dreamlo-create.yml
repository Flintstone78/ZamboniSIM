# One-off: provision a no-account JSON store for the global leaderboard from a
# runner (the dev sandbox can't reach these hosts). Creates an empty array blob
# on jsonblob.com and prints the new blob id (in the Location header); also
# probes kvdb.io as a fallback. Trigger by touching design/dreamlo-create.txt.
name: dreamlo-create

on:
  push:
    paths:
      - design/dreamlo-create.txt

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create jsonblob
        run: |
          echo "=== jsonblob create (look for Location: .../api/jsonBlob/<id>) ==="
          curl -sS -i --max-time 25 \
            -X POST 'https://jsonblob.com/api/jsonBlob' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '[]' | grep -iE '^(HTTP|Location)' || true
          echo
          echo "=== kvdb.io create (fallback; prints bucket id) ==="
          curl -sS --max-time 25 -d '{}' 'https://kvdb.io/' || true
          echo
