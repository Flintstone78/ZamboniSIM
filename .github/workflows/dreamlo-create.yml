# One-off: provision a no-account dreamlo leaderboard from a runner (the dev
# sandbox can't reach dreamlo.com). Prints the returned key pair to the log;
# trigger by touching design/dreamlo-create.txt.
name: dreamlo-create

on:
  push:
    paths:
      - design/dreamlo-create.txt

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create leaderboard
        run: |
          for url in \
            "https://www.dreamlo.com/lb/createNew" \
            "https://dreamlo.com/lb/createNew"; do
            echo "=== $url ==="
            curl -sS -L --max-time 20 "$url" || true
            echo
            echo "=========================="
          done
