# Mirrors generated art assets (Higgsfield CDN) into the repo. The dev
# sandbox's network policy blocks the CDN, so the runner fetches and commits
# instead. Dispatch with newline-separated "url|repo/path" pairs.
name: fetch-assets

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Newline-separated "url|path" pairs'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          FILES: ${{ inputs.files }}
        run: |
          while IFS='|' read -r url path; do
            [ -z "$url" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL "$url" -o "$path"
            echo "fetched $path"
          done <<< "$FILES"
      - name: Commit
        run: |
          git config user.name "asset-fetch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Lägg till genererade grafik-assets" || echo "nothing to commit"
          git push
